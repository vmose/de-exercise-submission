name: "inkomoko_de_exercise"
version: "1.0.0"
config-version: 2

profile: "inkomoko_de_exercise"

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  # Tolerance for A3 reconciliation, as a fraction (0.005 = 0.5%). See
  # DECISIONS.md for why this value.
  reconciliation_tolerance_pct: 0.005
  # As-of date used to compute ages for the "minor" (<18) restricted-data flag.
  as_of_date: "2026-09-25"
  # Where DQ1-validated source files live. Raw models read only from here,
  # never from source/ directly.
  validated_dir: "validated"

models:
  inkomoko_de_exercise:
    raw:
      +materialized: table
      +schema: raw
    staging:
      +materialized: table
      +schema: staging
    intermediate:
      +materialized: table
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts
    quality:
      +materialized: table
      +schema: quality
